services:
  - type: web
    name: shadowmind-api
    env: python
    # Installation target depends on where the requirements live.
    # From root, Render automatically uses Python's pip ecosystem.
    buildCommand: "pip install -r requirements.txt"
    # Port is dynamically injected by Render
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: ENVIRONMENT
        value: production
